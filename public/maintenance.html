<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barwa Developments</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #f7f0e4;
}

.maintenance {
    position: relative;
    width: 100vw;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f7f0e4;
}

.main-image {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

/* Rotating Barwa star */
.star {
    position: absolute;
    top: calc(27% + 1cm);
    left: 50%;
    width: 48px;
    height: 48px;
    transform: translate(-50%, -50%);
    animation: rotateStar 7s linear infinite;
}

.star img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

@keyframes rotateStar {
    from {
        transform: translate(-50%, -50%) rotate(0deg);
    }
    to {
        transform: translate(-50%, -50%) rotate(360deg);
    }
}

@media (max-width: 768px) {
    .maintenance {
        height: 100svh;
    }

    .main-image {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }

    .star {
        top: 25%;
        width: 34px;
        height: 34px;
    }
}
</style>
</head>

<body>

<div class="maintenance">

    <img
        class="main-image"
        src="/maintenance.jpg"
        alt="Barwa Developments - Website Under Construction"
    >

    <div class="star">
        <img src="/brand/barwa-star.svg" alt="">
    </div>

</div>

</body>
</html>
